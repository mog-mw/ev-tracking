category: Lighting

mods:
  - name: Improved Lights for All Shaders
    url: https://www.nexusmods.com/morrowind/mods/51463
    download_info:
      - file_name: ILFAS
    data_paths:
      - 00 Core
      - 01 Smoke and Steam Emitters
    settings: |
      [Shaders]
      clamp lighting = false

  - name: Glow in the Dahrk
    url: https://www.nexusmods.com/morrowind/mods/45886
    download_info:
      - file_name: Glow in the Dahrk
    data_paths:
      - 00 Core
      - 01 Hi Res Window Texture Replacer
      - 04 Raven Rock Glass Windows
      - 07 Telvanni Tower Interior Glow OpenMW

  - name: Harvest Lights
    url: https://modding-openmw.gitlab.io/harvest-lights/
    download_info:
      - file_name: Harvest Lights
    plugins:
      - harvest-lights.omwscripts

  - name: (OpenMW) Leave The Lights Off
    url: https://www.nexusmods.com/morrowind/mods/57510
    download_info:
      - file_name: LeaveTheLightsOff
        nexus_file_id: 1000066569
    data_paths:
      - LeaveTheLightsOff
    plugins:
      - LeaveTheLightsOff.omwscripts
      - Held Light Boost.omwscripts

  - name: Held Light Boost
    url: https://www.nexusmods.com/morrowind/mods/59576
    download_info:
      - file_name: Held Light Boost 1.1.0
    data_paths:
      - Held Light Boost
